<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学教育测评系统 V4.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f7f5e9;color:#333;line-height:1.6;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:16px}

/* 首页 */
.home-header{text-align:center;padding:28px 0 20px}
.home-header h1{font-size:26px;color:#5d4037;margin-bottom:6px}
.home-header p{color:#8d6e63;font-size:14px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card h3{font-size:16px;color:#5d4037;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.btn-select{padding:14px;border:2px solid #e8e0d0;border-radius:12px;background:#fff;cursor:pointer;text-align:center;transition:all .2s;font-size:15px;font-weight:600;color:#5d4037}
.btn-select:hover{border-color:#d4a373;transform:translateY(-1px)}
.btn-select.active{border-color:#d4a373;background:#d4a373;color:#fff}
.btn-primary{width:100%;padding:16px;background:#c53d32;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.wx-tip{text-align:center;padding:14px;background:#fff8e1;border:1px solid #ffe082;border-radius:12px;margin-top:14px;color:#8d6e63;font-size:13px}

/* 答题页 */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.quiz-tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600}
.tag-blue{background:#e3f2fd;color:#1976d2}
.tag-pink{background:#fce4ec;color:#c2185b}
.tag-purple{background:#f3e5f5;color:#7b1fa2}
.quiz-meta{font-size:14px;color:#8d6e63;font-weight:600}
.progress-bar{height:8px;background:#e8e0d0;border-radius:4px;margin-bottom:18px;overflow:hidden}
.progress-fill{height:100%;background:#e65100;transition:width .3s;border-radius:4px}

.question-card{background:#fff;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.question-num{color:#e65100;font-weight:700;margin-bottom:10px;font-size:13px}
.question-text{font-size:18px;font-weight:700;margin-bottom:20px;color:#3e2723;line-height:1.6}

.option{display:flex;align-items:center;padding:14px 16px;border:2px solid #e8e0d0;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .2s;font-size:16px;background:#fff}
.option:hover{border-color:#d4a373;background:#fffbf5}
.option-letter{width:32px;height:32px;border-radius:50%;border:2px solid #d4a373;color:#d4a373;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:12px;flex-shrink:0;font-size:14px}
.option.correct{border-color:#4caf50;background:#f1f8e9}
.option.correct .option-letter{border-color:#4caf50;background:#4caf50;color:#fff}
.option.wrong{border-color:#e53935;background:#ffebee}
.option.wrong .option-letter{border-color:#e53935;background:#e53935;color:#fff}
.option.disabled{pointer-events:none;opacity:.75}

.parse{margin-top:14px;padding:14px;background:#f1f8e9;border-left:4px solid #4caf50;border-radius:8px;display:none;font-size:14px;line-height:1.6;color:#33691e}
.parse.show{display:block}
.parse-title{font-weight:700;margin-bottom:4px}

.bottom-bar{display:flex;gap:10px;margin-top:14px}
.bottom-btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.bottom-btn-gray{background:#f5f5f5;color:#666}
.bottom-btn-orange{background:#f9c74f;color:#5d4037}
.bottom-btn-red{background:#c53d32;color:#fff}
.bottom-btn:hover{opacity:.85}

.submit-bar{margin-top:10px}

/* 结果页 */
.result-score{text-align:center;padding:30px 20px}
.score-num{font-size:56px;font-weight:800;color:#e65100;line-height:1}
.score-label{color:#8d6e63;margin-top:6px;font-size:15px}
.result-detail{margin-top:16px}
.detail-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.detail-item:last-child{border-bottom:none}

/* 弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);display:none;justify-content:center;align-items:center;z-index:1000;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:28px;max-width:360px;width:100%;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:48px;margin-bottom:12px}
.modal h2{margin-bottom:8px;color:#3e2723;font-size:20px}
.modal p{color:#8d6e63;margin-bottom:20px;font-size:14px;line-height:1.6}
.modal-btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;cursor:pointer;margin-bottom:10px;font-weight:700}
.modal-btn.green{background:#4caf50;color:#fff}
.modal-btn.gray{background:#f5f5f5;color:#5d4037}
.modal-btn.blue{background:#e3f2fd;color:#1976d2}
.wx-box{background:#fff8e1;border-radius:10px;padding:12px;margin-bottom:16px}
.wx-box strong{color:#e65100;font-size:20px;letter-spacing:1px}

.hidden{display:none !important}
</style>
</head>
<body>
<div id="app"></div>

<!-- 试用结束弹窗 -->
<div id="trialModal" class="modal">
  <div class="modal-box">
    <div class="modal-icon">☕</div>
    <h2>试用结束</h2>
    <p>今日<span style="color:#e65100;font-weight:700">10题</span>试用已完成！<br>完整版包含 1-6年级全部题库<br>每日随机20题 · 详细解析 · 薄弱点分析</p>
    <div class="wx-box">
      <div style="font-size:13px;color:#8d6e63;margin-bottom:6px">☕ 解锁仅需一杯奶茶钱</div>
      <strong>18778629849</strong>
    </div>
    <button class="modal-btn green" onclick="App.copyWX()">📋 复制微信号</button>
    <button class="modal-btn gray" onclick="App.goHome()">🏠 返回首页</button>
    <button class="modal-btn blue" onclick="location.reload()">🔄 明天再来（刷新）</button>
  </div>
</div>

<script>
const App = {
  state: {
    page: 'home',
    grade: null,
    subject: null,
    difficulty: null,
    paper: null,
    currentQ: 0,
    score: 0,
    answers: [],
    questions: [],
    trialCount: 0,
    startTime: 0,
    timer: null,
    elapsed: 0
  },

  subjects: {
    math: {name:'数学',icon:'🔢',color:'tag-blue'},
    chinese: {name:'语文',icon:'📖',color:'tag-blue'},
    english: {name:'英语',icon:'🔤',color:'tag-blue'},
    common: {name:'常识',icon:'🌍',color:'tag-blue'}
  },

  difficulties: {
    easy: {name:'简单',color:'tag-blue'},
    medium: {name:'中等',color:'tag-pink'},
    hard: {name:'困难',color:'tag-pink'}
  },

  papers: {
    A: {name:'A卷',color:'tag-purple'},
    B: {name:'B卷',color:'tag-purple'},
    C: {name:'C卷',color:'tag-purple'}
  },

  init() {
    this.loadTrialCount();
    this.render();
  },

  loadTrialCount() {
    const today = new Date().toDateString();
    const saved = JSON.parse(localStorage.getItem('trialData') || '{"date":"","count":0}');
    if(saved.date !== today) {
      this.state.trialCount = 0;
      localStorage.setItem('trialData', JSON.stringify({date:today,count:0}));
    } else {
      this.state.trialCount = saved.count;
    }
  },

  saveTrialCount() {
    const today = new Date().toDateString();
    localStorage.setItem('trialData', JSON.stringify({date:today,count:this.state.trialCount}));
  },

  // 题库生成
  generateQuestions(grade, subject, difficulty, paper) {
    const pool = [];
    const base = [
      // 数学
      {sub:'math',g:[1,2],t:'1 + 1 = ?',o:['1','2','3','4'],a:1,p:'1加1等于2，这是最基本的加法。'},
      {sub:'math',g:[1,2],t:'5 × 2 = ?',o:['7','10','12','15'],a:1,p:'五二一十，5×2=10。'},
      {sub:'math',g:[1,2],t:'10 - 3 = ?',o:['5','6','7','8'],a:2,p:'10减3等于7。'},
      {sub:'math',g:[1,2],t:'一个三角形有几条边？',o:['2','3','4','5'],a:1,p:'三角形有3条边。'},
      {sub:'math',g:[1,2],t:'3/8 + 5/8 = ?',o:['3/8','8/15','8/8','1'],a:3,p:'同分母分数相加，分母不变分子相加：3+5=8，所以8/8=1。'},
      {sub:'math',g:[3,4],t:'36 ÷ 9 = ?',o:['3','4','5','6'],a:1,p:'四九三十六，36÷9=4。'},
      {sub:'math',g:[3,4],t:'100 - 37 = ?',o:['53','63','73','83'],a:1,p:'100-37=63，借位减法要注意。'},
      {sub:'math',g:[3,4],t:'0.5 等于几分之几？',o:['1/3','1/2','1/4','2/5'],a:1,p:'0.5 = 1/2 = 一半。'},
      {sub:'math',g:[3,4],t:'正方形周长 = 边长 × ?',o:['2','3','4','5'],a:2,p:'正方形4条边相等，周长=边长×4。'},
      {sub:'math',g:[3,4],t:'3/4 > 1/2 吗？',o:['对','错'],a:0,p:'3/4=0.75，1/2=0.5，所以3/4更大。'},
      {sub:'math',g:[5,6],t:'12和18的最大公约数是？',o:['2','3','6','12'],a:2,p:'12=2×2×3，18=2×3×3，最大公约数是6。'},
      {sub:'math',g:[5,6],t:'圆的周长公式是？',o:['πr','2πr','πr²','2πr²'],a:1,p:'周长=2πr，面积=πr²，不要混淆。'},
      {sub:'math',g:[5,6],t:'2³ = ?',o:['6','8','9','12'],a:1,p:'2³ = 2×2×2 = 8。'},
      {sub:'math',g:[5,6],t:'25% 写成小数是？',o:['0.25','2.5','0.025','25'],a:0,p:'25% = 25/100 = 0.25。'},
      {sub:'math',g:[5,6],t:'三角形内角和是多少度？',o:['180','360','90','270'],a:0,p:'任意三角形内角和都是180度。'},
      // 语文
      {sub:'chinese',g:[1,2,3],t:'"春眠不觉晓"的下一句是？',o:['处处闻啼鸟','夜来风雨声','花落知多少','明月来相照'],a:0,p:'孟浩然《春晓》：春眠不觉晓，处处闻啼鸟。'},
      {sub:'chinese',g:[1,2,3],t:'"床前明月光"的作者是？',o:['杜甫','李白','王维','白居易'],a:1,p:'李白《静夜思》：床前明月光，疑是地上霜。'},
      {sub:'chinese',g:[1,2,3],t:'"少壮不努力"的下句？',o:['老大徒伤悲','黄河入海流','白毛浮绿水','粒粒皆辛苦'],a:0,p:'《长歌行》：少壮不努力，老大徒伤悲。'},
      {sub:'chinese',g:[1,2,3],t:'"画蛇添足"是？',o:['寓言','童话','神话','历史'],a:0,p:'画蛇添足是寓言故事，比喻多此一举。'},
      {sub:'chinese',g:[1,2,3],t:'"的、地、得"中，动词前用？',o:['的','地','得','都可以'],a:1,p:'动词前用"地"，如"快乐地跑"；名词前"的"，形容词后"得"。'},
      {sub:'chinese',g:[4,5,6],t:'"三人行，必有我师"出自？',o:['《论语》','《孟子》','《大学》','《中庸》'],a:0,p:'出自《论语·述而》，是孔子的话。'},
      {sub:'chinese',g:[4,5,6],t:'"桃花潭水深千尺"用了什么修辞？',o:['比喻','拟人','夸张','排比'],a:2,p:'用"深千尺"夸张潭水之深，表达友情深厚。'},
      {sub:'chinese',g:[4,5,6],t:'"卧薪尝胆"说的是谁？',o:['勾践','夫差','项羽','刘邦'],a:0,p:'越王勾践战败后卧薪尝胆，最终复国。'},
      {sub:'chinese',g:[4,5,6],t:'"桂林山水甲天下"中"甲"的意思是？',o:['第一','铠甲','士兵','植物'],a:0,p:'甲天下即天下第一。'},
      {sub:'chinese',g:[4,5,6],t:'"一"字在"一心一意"中读几声？',o:['一声','二声','四声','轻声'],a:0,p:'一心一意中两个"一"都读原调第一声。'},
      // 英语
      {sub:'english',g:[1,2,3],t:'"Hello"对应的中文是？',o:['你好','再见','谢谢','对不起'],a:0,p:'Hello是你好的意思。'},
      {sub:'english',g:[1,2,3],t:'"Cat"是什么动物？',o:['狗','猫','鸟','鱼'],a:1,p:'Cat是猫，Dog是狗。'},
      {sub:'english',g:[1,2,3],t:'"I ___ a student." 填？',o:['is','am','are','be'],a:1,p:'I后面用am，you用are，he/she用is。'},
      {sub:'english',g:[1,2,3],t:'"Apple"的复数是？',o:['Apples','Appleses','Apple','Applies'],a:0,p:'一般名词复数直接加s。'},
      {sub:'english',g:[1,2,3],t:'"Red"是什么颜色？',o:['红','绿','蓝','黄'],a:0,p:'Red红色，Green绿色，Blue蓝色，Yellow黄色。'},
      {sub:'english',g:[4,5,6],t:'"What is your name?" 是？',o:['问名字','问年龄','问颜色','问时间'],a:0,p:'What is your name?是询问对方名字。'},
      {sub:'english',g:[4,5,6],t:'"How are you?" 怎么回答？',o:['Fine, thanks.','I am 8.','I am Tom.','Yes.'],a:0,p:'How are you?常用Fine, thanks.回答。'},
      {sub:'english',g:[4,5,6],t:'"Good morning" 什么时候说？',o:['早上','中午','晚上','深夜'],a:0,p:'Morning是早上，afternoon下午，evening晚上。'},
      {sub:'english',g:[4,5,6],t:'"Book"的中文是？',o:['书','笔','橡皮','尺子'],a:0,p:'Book书，Pen笔，Eraser橡皮，Ruler尺子。'},
      {sub:'english',g:[4,5,6],t:'"Thank you" 回答？',o:['You are welcome.','Yes.','No.','Hello.'],a:0,p:'You are welcome.不客气，是标准回答。'},
      // 常识
      {sub:'common',g:[1,2,3,4,5,6],t:'一年有几个季节？',o:['2','3','4','5'],a:2,p:'一年有春夏秋冬四个季节。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'中国的首都是？',o:['上海','北京','广州','深圳'],a:1,p:'北京是中华人民共和国的首都。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'水在多少度结冰？',o:['0℃','10℃','100℃','-10℃'],a:0,p:'标准大气压下，水在0℃结冰，100℃沸腾。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'人体最大的器官是？',o:['心脏','肝脏','皮肤','大脑'],a:2,p:'皮肤是人体最大的器官，具有保护作用。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'彩虹有几种颜色？',o:['5','6','7','8'],a:2,p:'红橙黄绿青蓝紫，共七种颜色。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'地球围着什么转？',o:['月亮','太阳','火星','木星'],a:1,p:'地球围绕太阳公转，同时自转。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'火警电话是？',o:['110','119','120','122'],a:1,p:'119是火警，110报警，120急救，122交通事故。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'太阳系有几大行星？',o:['7','8','9','10'],a:1,p:'太阳系有八大行星。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'植物靠什么制造养分？',o:['光合作用','呼吸作用','吸收作用','分解作用'],a:0,p:'植物通过光合作用利用阳光、水和二氧化碳制造养分。'},
      {sub:'common',g:[1,2,3,4,5,6],t:'我国最长的河流是？',o:['黄河','长江','珠江','黑龙江'],a:1,p:'长江是我国第一长河，世界第三长河。'}
    ];

    // 筛选符合年级和科目的题
    let filtered = base.filter(q => q.sub === subject && q.g.includes(grade));
    if(filtered.length < 10) {
      // 不足则补充该科目其他年级题目
      const extra = base.filter(q => q.sub === subject && !q.g.includes(grade));
      filtered = filtered.concat(extra);
    }

    // 根据卷型打乱顺序，确保A/B/C卷不同
    const seed = paper.charCodeAt(0) + grade + (subject.charCodeAt(0));
    const shuffled = this.shuffle(filtered, seed);

    // 取10题
    const selected = shuffled.slice(0, 10);

    return selected.map((item, idx) => ({
      id: idx,
      text: item.t,
      options: item.o,
      answer: item.a,
      parse: item.p
    }));
  },

  shuffle(arr, seed) {
    const a = [...arr];
    let s = seed;
    for(let i = a.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      const j = s % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  /* ===== 核心修复：返回首页 ===== */
  goHome() {
    // 强制关闭弹窗（关键修复！）
    const modal = document.getElementById('trialModal');
    if(modal) modal.classList.remove('show');

    // 清除计时器
    if(this.state.timer) clearInterval(this.state.timer);

    // 彻底重置状态
    this.state.page = 'home';
    this.state.grade = null;
    this.state.subject = null;
    this.state.difficulty = null;
    this.state.paper = null;
    this.state.currentQ = 0;
    this.state.score = 0;
    this.state.answers = [];
    this.state.questions = [];
    this.state.startTime = 0;
    this.state.elapsed = 0;
    if(this.state.timer) clearInterval(this.state.timer);
    this.state.timer = null;

    this.render();
  },

  selectGrade(g) {
    this.state.grade = g;
    this.render();
  },

  selectSubject(s) {
    this.state.subject = s;
    this.render();
  },

  selectDifficulty(d) {
    this.state.difficulty = d;
    this.render();
  },

  selectPaper(p) {
    this.state.paper = p;
    this.render();
  },

  startQuiz() {
    const s = this.state;
    s.questions = this.generateQuestions(s.grade, s.subject, s.difficulty, s.paper);
    s.currentQ = 0;
    s.score = 0;
    s.answers = [];
    s.page = 'quiz';
    s.startTime = Date.now();
    s.elapsed = 0;
    s.timer = setInterval(() => {
      s.elapsed = Math.floor((Date.now() - s.startTime) / 1000);
      // 只更新计时器显示，不重新渲染整个页面
      const timerEl = document.getElementById('timerDisplay');
      if(timerEl) timerEl.textContent = this.formatTime(s.elapsed);
    }, 1000);
    this.render();
  },

  formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2,'0');
    const s = (sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  },

  /* ===== 核心修复：点击选项自动确认+自动下一题，去掉多余下一题按钮 ===== */
  selectOption(idx) {
    if(this.state.answers[this.state.currentQ] !== undefined) return;

    // 试用限制检查（在未答题前检查）
    if(this.state.trialCount >= 10) {
      this.showTrialModal();
      return;
    }

    const q = this.state.questions[this.state.currentQ];
    const isCorrect = idx === q.answer;
    this.state.answers[this.state.currentQ] = idx;
    if(isCorrect) this.state.score++;

    this.state.trialCount++;
    this.saveTrialCount();

    this.render(); // 显示对错和解析

    // 1.5秒后自动下一题或结束
    setTimeout(() => {
      if(this.state.currentQ < this.state.questions.length - 1) {
        this.state.currentQ++;
        this.render();
      } else {
        this.finishQuiz();
      }
    }, 1500);
  },

  prevQuestion() {
    if(this.state.currentQ > 0) {
      this.state.currentQ--;
      this.render();
    }
  },

  finishQuiz() {
    if(this.state.timer) clearInterval(this.state.timer);
    this.state.page = 'result';
    this.render();
  },

  showTrialModal() {
    document.getElementById('trialModal').classList.add('show');
  },

  copyWX() {
    const wx = '18778629849';
    if(navigator.clipboard) {
      navigator.clipboard.writeText(wx).then(() => alert('微信号已复制：' + wx));
    } else {
      const ta = document.createElement('textarea');
      ta.value = wx;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('微信号已复制：' + wx);
    }
  },

  /* ===== 渲染 ===== */
  render() {
    const app = document.getElementById('app');
    const s = this.state;

    if(s.page === 'home') {
      app.innerHTML = `
        <div class="home-header">
          <h1>📚 小学教育测评系统</h1>
          <p>智能分卷 · 即时反馈 · 四科覆盖</p>
        </div>
        <div class="container">
          <div class="card">
            <h3>🎓 选择年级</h3>
            <div class="grid">
              ${[1,2,3,4,5,6].map(g => `
                <div class="btn-select ${s.grade===g?'active':''}" onclick="App.selectGrade(${g})">${g}年级</div>
              `).join('')}
            </div>
          </div>

          ${s.grade ? `
          <div class="card">
            <h3>📖 选择科目</h3>
            <div class="grid grid-2">
              ${Object.entries(this.subjects).map(([k,v]) => `
                <div class="btn-select ${s.subject===k?'active':''}" onclick="App.selectSubject('${k}')">${v.icon} ${v.name}</div>
              `).join('')}
            </div>
          </div>
          ` : ''}

          ${s.subject ? `
          <div class="card">
            <h3>⚡ 选择难度</h3>
            <div class="grid grid-2">
              ${Object.entries(this.difficulties).map(([k,v]) => `
                <div class="btn-select ${s.difficulty===k?'active':''}" onclick="App.selectDifficulty('${k}')">${v.name}</div>
              `).join('')}
            </div>
          </div>
          ` : ''}

          ${s.difficulty ? `
          <div class="card">
            <h3>📝 选择试卷</h3>
            <div class="grid">
              ${Object.entries(this.papers).map(([k,v]) => `
                <div class="btn-select ${s.paper===k?'active':''}" onclick="App.selectPaper('${k}')">${v.name}</div>
              `).join('')}
            </div>
          </div>
          ` : ''}

          ${s.paper ? `
          <button class="btn-primary" onclick="App.startQuiz()">🚀 开始测评</button>
          ` : ''}

          <div class="wx-tip">
            💡 今日已体验 <strong>${this.state.trialCount}/10</strong> 题<br>
            完整版联系微信：18778629849
          </div>
        </div>
      `;
    }

    else if(s.page === 'quiz') {
      const q = s.questions[s.currentQ];
      const progress = ((s.currentQ + 1) / s.questions.length) * 100;
      const hasAnswered = s.answers[s.currentQ] !== undefined;
      const isCorrect = hasAnswered && s.answers[s.currentQ] === q.answer;
      const subInfo = this.subjects[s.subject];
      const diffInfo = this.difficulties[s.difficulty];
      const paperInfo = this.papers[s.paper];

      app.innerHTML = `
        <div class="container" style="padding-top:12px">
          <div class="quiz-header">
            <div class="quiz-tags">
              <span class="tag ${subInfo.color}">${subInfo.name}</span>
              <span class="tag ${diffInfo.color}">${diffInfo.name}</span>
              <span class="tag ${paperInfo.color}">${paperInfo.name}</span>
            </div>
            <div class="quiz-meta">${s.currentQ + 1}/${s.questions.length} · ⏱️<span id="timerDisplay">${this.formatTime(s.elapsed)}</span></div>
          </div>

          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>

          <div class="question-card">
            <div class="question-num">第 ${s.currentQ + 1} 题</div>
            <div class="question-text">${q.text}</div>
            <div class="options">
              ${q.options.map((opt, idx) => `
                <div class="option ${hasAnswered ? (idx===q.answer?'correct':(idx===s.answers[s.currentQ]?'wrong':'')) : ''} ${hasAnswered?'disabled':''}" 
                     onclick="App.selectOption(${idx})">
                  <span class="option-letter">${['A','B','C','D'][idx]}</span>
                  <span>${opt}</span>
                </div>
              `).join('')}
            </div>
            <div class="parse ${hasAnswered?'show':''}">
              <div class="parse-title">${isCorrect?'🎉 回答正确！':'😅 回答错误'}</div>
              ${q.parse}
            </div>
          </div>

          <!-- 修复：去掉多余的"下一题"按钮，只保留上一题（回顾）和结束提交 -->
          <div class="bottom-bar">
            <button class="bottom-btn bottom-btn-gray ${s.currentQ===0?'disabled':''}" onclick="App.prevQuestion()" ${s.currentQ===0?'disabled':''}>
              ⬅️ 上一题
            </button>
            <button class="bottom-btn bottom-btn-red" onclick="App.finishQuiz()">
              ⏹️ 结束并提交
            </button>
          </div>

          <div style="text-align:center;color:#999;font-size:12px;margin-top:10px">
            已答 ${s.answers.filter(a=>a!==undefined).length}/10 题 · ${paperInfo.name}
          </div>
        </div>
      `;
    }

    else if(s.page === 'result') {
      const pct = Math.round((s.score / s.questions.length) * 100);
      let comment = pct >= 90 ? '太棒了！🌟' : pct >= 60 ? '继续加油！💪' : '多多练习！📚';
      const paperInfo = this.papers[s.paper];

      app.innerHTML = `
        <div class="container" style="padding-top:20px">
          <div class="card result-score">
            <div class="score-num">${pct}</div>
            <div class="score-label">分 ${comment}</div>
          </div>
          <div class="card result-detail">
            <div class="detail-item"><span>科目</span><span>${this.subjects[s.subject].name}</span></div>
            <div class="detail-item"><span>年级</span><span>${s.grade}年级</span></div>
            <div class="detail-item"><span>难度</span><span>${this.difficulties[s.difficulty].name}</span></div>
            <div class="detail-item"><span>试卷</span><span>${paperInfo.name}</span></div>
            <div class="detail-item"><span>总题数</span><span>${s.questions.length}题</span></div>
            <div class="detail-item"><span>答对</span><span>${s.score}题</span></div>
            <div class="detail-item"><span>答错</span><span>${s.questions.length - s.score}题</span></div>
            <div class="detail-item"><span>用时</span><span>${this.formatTime(s.elapsed)}</span></div>
          </div>
          <button class="btn-primary" onclick="App.goHome()">🏠 返回首页</button>
          <div class="wx-tip">
            📱 完整版解锁无限刷题 + 错题本 + 打印试卷<br>
            联系微信：<strong>18778629849</strong>
          </div>
        </div>
      `;
    }
  }
};

App.init();
</script>
</body>
</html>
