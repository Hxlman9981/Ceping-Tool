<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学教育测评系统 V5.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#e0f7fa 0%,#f3e5f5 30%,#fff3e0 60%,#e8f5e9 100%);
  color:#2d3436;
  line-height:1.5;
  position:relative;
}

/* 背景光晕 */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);opacity:.5;
}
body::before{
  width:300px;height:300px;background:radial-gradient(circle,#a8edea 0%,transparent 70%);
  top:-100px;right:-100px;
}
body::after{
  width:400px;height:400px;background:radial-gradient(circle,#fed6e3 0%,transparent 70%);
  bottom:-150px;left:-150px;
}

.container{max-width:420px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* ===== 液态玻璃卡片 ===== */
.liquid{
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:24px;
  border:1px solid rgba(255,255,255,.5);
  box-shadow:
    0 8px 32px rgba(31,38,135,.1),
    inset 0 0 0 1px rgba(255,255,255,.4),
    inset 0 1px 0 rgba(255,255,255,.6);
  padding:20px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.liquid::before{
  content:"";position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,transparent 100%);
  pointer-events:none;border-radius:24px 24px 0 0;
}

/* ===== 顶部标题区 ===== */
.header{
  text-align:center;padding:28px 0 16px;
}
.header h1{
  font-size:22px;font-weight:800;color:#2d3436;
  letter-spacing:-.5px;
  text-shadow:0 2px 4px rgba(0,0,0,.05);
}
.header p{
  font-size:13px;color:#636e72;margin-top:4px;
}
.badge{
  display:inline-block;background:rgba(0,184,148,.15);
  color:#00b894;padding:3px 10px;border-radius:12px;
  font-size:11px;font-weight:700;margin-left:6px;
  border:1px solid rgba(0,184,148,.2);
  backdrop-filter:blur(4px);
}

/* ===== 液态按钮 ===== */
.liquid-btn{
  padding:14px 10px;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.6);
  border-radius:18px;
  cursor:pointer;text-align:center;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  font-size:15px;font-weight:700;color:#2d3436;
  box-shadow:0 4px 12px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.5);
  position:relative;overflow:hidden;
}
.liquid-btn:active{transform:scale(.96)}
.liquid-btn.active{
  background:linear-gradient(135deg,rgba(0,184,148,.7),rgba(0,206,180,.8));
  color:#fff;border-color:rgba(255,255,255,.3);
  box-shadow:0 6px 20px rgba(0,184,148,.25),inset 0 1px 0 rgba(255,255,255,.3);
}

/* 大按钮 */
.liquid-primary{
  width:100%;padding:16px;
  background:linear-gradient(135deg,rgba(253,121,168,.85),rgba(232,67,147,.9));
  backdrop-filter:blur(12px);
  color:#fff;border:none;border-radius:20px;
  font-size:17px;font-weight:800;cursor:pointer;
  margin-top:4px;transition:all .3s;
  box-shadow:0 8px 24px rgba(253,121,168,.3),inset 0 1px 0 rgba(255,255,255,.3);
  border:1px solid rgba(255,255,255,.3);
  letter-spacing:.5px;
}
.liquid-primary:active{transform:scale(.97)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-2{grid-template-columns:repeat(2,1fr)}

.section-title{
  font-size:15px;font-weight:700;color:#2d3436;
  margin-bottom:12px;display:flex;align-items:center;gap:6px;
}

/* ===== 答题页 ===== */
.quiz-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.quiz-tag{
  font-size:12px;padding:5px 14px;border-radius:20px;
  font-weight:700;background:rgba(0,184,148,.15);
  color:#00b894;border:1px solid rgba(0,184,148,.2);
  backdrop-filter:blur(8px);
}
.timer-pill{
  font-size:13px;color:#636e72;font-weight:600;
  background:rgba(255,255,255,.4);padding:5px 12px;
  border-radius:12px;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.5);
}

.progress-box{margin-bottom:14px}
.progress-track{
  height:8px;background:rgba(0,0,0,.06);
  border-radius:4px;overflow:hidden;
  border:1px solid rgba(255,255,255,.3);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#00b894,#fd79a8);
  transition:width .5s cubic-bezier(.4,0,.2,1);
  border-radius:4px;
}
.progress-text{
  text-align:center;font-size:12px;color:#b2bec3;
  margin-top:6px;font-weight:600;
}

/* 题目区 */
.q-liquid{
  background:rgba(255,255,255,.3);
  backdrop-filter:blur(20px) saturate(180%);
  border-radius:24px;border:1px solid rgba(255,255,255,.5);
  box-shadow:0 8px 32px rgba(31,38,135,.08),inset 0 0 0 1px rgba(255,255,255,.4);
  padding:22px 20px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.q-liquid::before{
  content:"";position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,transparent 100%);
  pointer-events:none;border-radius:24px 24px 0 0;
}
.q-num{
  font-size:13px;font-weight:700;color:#00b894;margin-bottom:8px;
  position:relative;
}
.q-text{
  font-size:18px;font-weight:800;color:#2d3436;
  line-height:1.6;position:relative;margin-bottom:18px;
}

/* 选项液态 */
.opt-liquid{
  display:flex;align-items:center;padding:14px 16px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.5);
  border-radius:16px;margin-bottom:10px;
  cursor:pointer;transition:all .25s;
  font-size:15px;position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.opt-liquid:active{transform:scale(.98)}
.opt-letter{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.6);
  border:1.5px solid rgba(0,184,148,.25);
  color:#00b894;display:flex;align-items:center;
  justify-content:center;font-weight:800;
  margin-right:12px;flex-shrink:0;font-size:13px;
  transition:all .25s;
}
.opt-liquid.correct{
  background:rgba(0,184,148,.12);
  border-color:rgba(0,184,148,.4);
}
.opt-liquid.correct .opt-letter{
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:#fff;border-color:transparent;
}
.opt-liquid.wrong{
  background:rgba(253,121,168,.1);
  border-color:rgba(253,121,168,.3);
}
.opt-liquid.wrong .opt-letter{
  background:linear-gradient(135deg,#fd79a8,#e84393);
  color:#fff;border-color:transparent;
}
.opt-liquid.disabled{pointer-events:none;opacity:.65}

/* 解析 */
.parse-liquid{
  margin-top:14px;padding:14px;
  background:rgba(0,184,148,.08);
  backdrop-filter:blur(8px);
  border-left:4px solid #00b894;
  border-radius:14px;display:none;
  font-size:14px;line-height:1.6;color:#2d3436;
  animation:fadeIn .3s;
  border:1px solid rgba(0,184,148,.15);
}
.parse-liquid.show{display:block}
.parse-title{font-weight:800;margin-bottom:4px;font-size:15px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* 底部导航 */
.nav-liquid{
  display:flex;gap:10px;margin-top:12px;
}
.nav-btn-liquid{
  flex:1;padding:12px;border-radius:16px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:all .25s;display:flex;align-items:center;
  justify-content:center;gap:4px;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.5);
  color:#636e72;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.nav-btn-liquid:active{transform:scale(.96)}
.nav-btn-liquid:disabled{
  background:rgba(200,200,200,.2);color:#b2bec3;
  cursor:not-allowed;box-shadow:none;
}
.nav-btn-liquid.red{
  background:linear-gradient(135deg,rgba(253,121,168,.8),rgba(232,67,147,.85));
  color:#fff;border-color:rgba(255,255,255,.3);
  box-shadow:0 4px 16px rgba(253,121,168,.2);
}

.status-text{
  text-align:center;color:#b2bec3;
  font-size:12px;margin-top:10px;font-weight:600;
}

/* ===== 结果页 ===== */
.score-liquid{
  text-align:center;padding:20px;
}
.score-circle{
  width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg,#00b894,#00cec9);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;margin:0 auto 12px;
  box-shadow:0 8px 24px rgba(0,184,148,.25);
  border:3px solid rgba(255,255,255,.4);
  color:#fff;position:relative;
}
.score-num{font-size:42px;font-weight:800;line-height:1}
.score-label{font-size:12px;opacity:.9;margin-top:2px}
.score-comment{font-size:17px;font-weight:700;color:#fd79a8;margin-top:6px}

.detail-row{
  display:flex;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);
  font-size:14px;position:relative;
}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#636e72}
.detail-value{color:#2d3436;font-weight:700}

/* 弹窗液态 */
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(45,52,54,.4);
  display:none;justify-content:center;align-items:center;
  z-index:1000;padding:20px;
  backdrop-filter:blur(8px);
}
.modal.show{display:flex}
.modal-liquid{
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(30px) saturate(180%);
  border-radius:28px;padding:32px 24px;
  max-width:360px;width:100%;text-align:center;
  animation:pop .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 20px 60px rgba(0,0,0,.12);
  border:1px solid rgba(255,255,255,.6);
  position:relative;overflow:hidden;
}
.modal-liquid::before{
  content:"";position:absolute;top:0;left:0;right:0;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,transparent 100%);
  pointer-events:none;
}
@keyframes pop{from{transform:scale(.85) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-icon{font-size:48px;margin-bottom:10px;position:relative}
.modal h2{margin-bottom:8px;color:#2d3436;font-size:20px;font-weight:800;position:relative}
.modal p{color:#636e72;margin-bottom:20px;font-size:14px;line-height:1.7;position:relative}
.modal-btn{
  display:block;width:100%;padding:13px;border-radius:16px;
  border:none;font-size:15px;cursor:pointer;margin-bottom:10px;
  font-weight:700;transition:all .25s;position:relative;
}
.modal-btn:active{transform:scale(.97)}
.modal-btn.green{
  background:linear-gradient(135deg,#00b894,#00cec9);
  color:#fff;box-shadow:0 4px 16px rgba(0,184,148,.2);
}
.modal-btn.gray{
  background:rgba(240,240,240,.7);color:#2d3436;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);
}
.modal-btn.pink{
  background:rgba(253,121,168,.15);color:#e84393;
  border:1.5px dashed rgba(253,121,168,.3);
  backdrop-filter:blur(8px);
}

.wx-liquid{
  background:rgba(253,121,168,.1);
  backdrop-filter:blur(8px);
  border-radius:14px;padding:12px;margin-bottom:16px;
  border:1.5px dashed rgba(253,121,168,.25);
  position:relative;
}
.wx-liquid strong{color:#e84393;font-size:20px;letter-spacing:1px;font-weight:800}

.tip-liquid{
  text-align:center;padding:14px;
  background:rgba(255,255,255,.3);
  backdrop-filter:blur(10px);
  border:1.5px dashed rgba(253,121,168,.2);
  border-radius:18px;margin-top:14px;
  color:#636e72;font-size:13px;line-height:1.7;
}

.hidden{display:none !important}
</style>
</head>
<body>
<div id="app"></div>

<!-- 试用结束弹窗 -->
<div id="trialModal" class="modal">
  <div class="modal-liquid">
    <div class="modal-icon">☕</div>
    <h2>试用结束</h2>
    <p>今日<span style="color:#e84393;font-weight:800">10题</span>试用已完成！<br>完整版每年级每科300题<br>无限刷题 · 详细解析</p>
    <div class="wx-liquid">
      <div style="font-size:12px;color:#636e72;margin-bottom:4px">☕ 解锁仅需一杯奶茶钱</div>
      <strong>18778629849</strong>
    </div>
    <button class="modal-btn green" onclick="App.copyWX()">📋 复制微信号</button>
    <button class="modal-btn gray" onclick="App.goHome()">🏠 返回首页</button>
    <button class="modal-btn pink" onclick="location.reload()">🔄 明天再来</button>
  </div>
</div>

<script>
/* ===== 题库生成器 ===== */
const QB={
  math(g){
    const qs=[],add=(t,o,a,p)=>qs.push({t,o,a,p});
    const r=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
    const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    if(g<=2){
      for(let i=0;i<300;i++){
        const type=r(1,5);
        if(type===1){const a=r(1,20),b=r(1,20),ans=a+b;add(`${a}+${b}=？`,sh([ans,ans+r(1,5),Math.abs(ans-r(1,5)),ans+10]).slice(0,4),0,`${a}+${b}=${ans}`)}
        else if(type===2){const a=r(5,20),b=r(1,a),ans=a-b;add(`${a}-${b}=？`,sh([ans,ans+r(1,5),Math.abs(ans-r(1,5)),ans+10]).slice(0,4),0,`${a}-${b}=${ans}`)}
        else if(type===3){const a=r(2,9),b=r(2,9),ans=a*b;add(`${a}×${b}=？`,sh([ans,ans+a,ans+b,ans+1]).slice(0,4),0,`${a}×${b}=${ans}`)}
        else if(type===4){const a=r(2,9),b=r(2,9),ans=a*b;add(`${ans}÷${a}=？`,sh([b,b+1,Math.abs(b-1),a]).slice(0,4),0,`${ans}÷${a}=${b}`)}
        else{const h=r(1,12),m=[0,15,30,45][r(0,3)];add(`${h}:${m.toString().padStart(2,'0')}是几点？`,sh([`${h}:${m.toString().padStart(2,'0')}`,`${h+1}:${m.toString().padStart(2,'0')}`,`${h-1}:${m.toString().padStart(2,'0')}`,`${h}:${(m+15)%60}`]).slice(0,4),0,`正确时间是${h}:${m.toString().padStart(2,'0')}`)}
      }
    }else if(g<=4){
      for(let i=0;i<300;i++){
        const type=r(1,5);
        if(type===1){const a=r(100,999),b=r(100,999),ans=a+b;add(`${a}+${b}=？`,sh([ans,ans+r(1,50),Math.abs(ans-r(1,50)),ans+100]).slice(0,4),0,`${a}+${b}=${ans}`)}
        else if(type===2){const a=r(200,999),b=r(100,a),ans=a-b;add(`${a}-${b}=？`,sh([ans,ans+r(1,50),Math.abs(ans-r(1,50)),ans+100]).slice(0,4),0,`${a}-${b}=${ans}`)}
        else if(type===3){const a=r(10,99),b=r(2,9),ans=a*b;add(`${a}×${b}=？`,sh([ans,ans+a,ans+b,ans+10]).slice(0,4),0,`${a}×${b}=${ans}`)}
        else if(type===4){const b=r(2,9),ans=r(10,99),a=ans*b;add(`${a}÷${b}=？`,sh([ans,ans+1,Math.abs(ans-1),ans+b]).slice(0,4),0,`${a}÷${b}=${ans}`)}
        else{const a=r(1,9),b=r(1,9),c=r(1,9);add(`${a}/${b}+${c}/${b}=？`,sh([`${a+c}/${b}`,`${a+c}/${b+b}`,`${a+c+1}/${b}`,`${a}/${b+c}`]).slice(0,4),0,`同分母相加：${a}+${c}=${a+c}，答案${a+c}/${b}`)}
      }
    }else{
      for(let i=0;i<300;i++){
        const type=r(1,5);
        if(type===1){const a=r(10,99),b=r(10,99),ans=a*b;add(`${a}×${b}=？`,sh([ans,ans+r(1,100),Math.abs(ans-r(1,100)),ans+100]).slice(0,4),0,`${a}×${b}=${ans}`)}
        else if(type===2){const a=r(2,50),b=r(2,50);const gg=this.gcd(a,b);add(`${a}和${b}的最大公约数是？`,sh([gg,gg+1,Math.abs(gg-1),gg+2]).filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`最大公约数是${gg}`)}
        else if(type===3){const a=r(1,20),b=r(1,20);const p=2*(a+b);add(`长方形长${a}cm，宽${b}cm，周长=？`,sh([p,2*a+b,a+2*b,a*b]).slice(0,4),0,`周长=2×(${a}+${b})=${p}cm`)}
        else if(type===4){const r0=r(1,10);const s=(3.14*r0*r0).toFixed(2);add(`半径${r0}的圆面积？（π=3.14）`,sh([s,(s*1).toFixed(2),(s*2).toFixed(2),(s/2).toFixed(2)]).slice(0,4),0,`面积=3.14×${r0}²=${s}`)}
        else{const a=r(1,20),b=r(1,20);add(`${a}/${b}化成小数是？`,sh([(a/b).toFixed(2),(a/b+0.1).toFixed(2),(a/b-0.1).toFixed(2),(a/(b+1)).toFixed(2)]).slice(0,4),0,`${a}/${b}=${(a/b).toFixed(2)}`)}
      }
    }
    return sh(qs);
  },
  gcd(a,b){while(b){[a,b]=[b,a%b]}return a},

  chinese(g){
    const qs=[],add=(t,o,a,p)=>qs.push({t,o,a,p});
    const p1=[
      {t:'"春眠不觉晓"下一句？',o:['处处闻啼鸟','夜来风雨声','花落知多少','明月来相照'],a:0,p:'孟浩然《春晓》'},
      {t:'"床前明月光"作者是？',o:['杜甫','李白','王维','白居易'],a:1,p:'李白《静夜思》'},
      {t:'"鹅鹅鹅，曲项向天歌"作者是？',o:['骆宾王','李白','杜甫','王维'],a:0,p:'骆宾王《咏鹅》'},
      {t:'"白日依山尽"下一句？',o:['黄河入海流','欲穷千里目','更上一层楼','春眠不觉晓'],a:0,p:'王之涣《登鹳雀楼》'},
      {t:'"谁知盘中餐"下一句？',o:['粒粒皆辛苦','汗滴禾下土','春种一粒粟','秋收万颗子'],a:0,p:'李绅《悯农》'},
      {t:'"小荷才露尖尖角"下一句？',o:['早有蜻蜓立上头','映日荷花别样红','接天莲叶无穷碧','春风又绿江南岸'],a:0,p:'杨万里《小池》'},
      {t:'"一年之计在于"？',o:['春','夏','秋','冬'],a:0,p:'一年之计在于春'},
      {t:'"一寸光阴一寸金"下一句？',o:['寸金难买寸光阴','光阴似箭','日月如梭','时不我待'],a:0,p:'寸金难买寸光阴'},
      {t:'"三人行，必有我师"出自？',o:['《论语》','《孟子》','《大学》','《中庸》'],a:0,p:'《论语·述而》'},
      {t:'"画蛇添足"是？',o:['寓言','童话','神话','历史'],a:0,p:'寓言故事'},

    ];
    while(qs.length<300){
      const q=pool[qs.length%pool.length];
      const opts=[...q.o],correct=opts[q.a];
      for(let k=opts.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]]}
      add(q.t,opts,opts.indexOf(correct),q.p);
    }
    return qs;
  },

  generate(grade,subject){
    let bank;
    if(subject==='math') bank=this.math(grade);
    else if(subject==='chinese') bank=this.chinese(grade);
    else if(subject==='english') bank=this.english(grade);
    else bank=this.common(grade);
    const sh=[...bank];
    for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]]}
    return sh.slice(0,10).map((q,i)=>({id:i,text:q.t,options:q.o,answer:q.a,parse:q.p}));
  }
};

const App={
  state:{
    page:'home',grade:null,subject:null,
    currentQ:0,score:0,answers:[],questions:[],
    trialCount:0,startTime:0,timer:null,elapsed:0,autoNextTimer:null
  },
  subjects:{
    math:{name:'数学',icon:'🔢'},
    chinese:{name:'语文',icon:'📖'},
    english:{name:'英语',icon:'🔤'},
    common:{name:'常识',icon:'🌍'}
  },
  init(){
    this.loadTrialCount();
    this.render();
  },
  loadTrialCount(){
    const today=new Date().toDateString();
    const saved=JSON.parse(localStorage.getItem('trialData')||'{"date":"","count":0}');
    if(saved.date!==today){this.state.trialCount=0;localStorage.setItem('trialData',JSON.stringify({date:today,count:0}));}
    else{this.state.trialCount=saved.count;}
  },
  saveTrialCount(){
    const today=new Date().toDateString();
    localStorage.setItem('trialData',JSON.stringify({date:today,count:this.state.trialCount}));
  },
  goHome(){
    const modal=document.getElementById('trialModal');
    if(modal)modal.classList.remove('show');
    if(this.state.autoNextTimer)clearTimeout(this.state.autoNextTimer);
    if(this.state.timer)clearInterval(this.state.timer);
    this.state.page='home';this.state.grade=null;this.state.subject=null;
    this.state.currentQ=0;this.state.score=0;this.state.answers=[];this.state.questions=[];
    this.state.startTime=0;this.state.elapsed=0;this.state.timer=null;this.state.autoNextTimer=null;
    this.render();
  },
  selectGrade(g){this.state.grade=g;this.render();},
  selectSubject(s){this.state.subject=s;this.render();},
  startQuiz(){
    const s=this.state;
    s.questions=QB.generate(s.grade,s.subject);
    s.currentQ=0;s.score=0;s.answers=[];s.page='quiz';
    s.startTime=Date.now();s.elapsed=0;
    s.timer=setInterval(()=>{
      s.elapsed=Math.floor((Date.now()-s.startTime)/1000);
      const el=document.getElementById('timerDisplay');
      if(el)el.textContent=this.formatTime(s.elapsed);
    },1000);
    this.render();
  },
  formatTime(sec){
    const m=Math.floor(sec/60).toString().padStart(2,'0');
    const s=(sec%60).toString().padStart(2,'0');
    return m+':'+s;
  },
  selectOption(idx){
    if(this.state.answers[this.state.currentQ]!==undefined)return;
    if(this.state.trialCount>=10){this.showTrialModal();return;}
    if(this.state.autoNextTimer)clearTimeout(this.state.autoNextTimer);
    const q=this.state.questions[this.state.currentQ];
    const isCorrect=idx===q.answer;
    this.state.answers[this.state.currentQ]=idx;
    if(isCorrect)this.state.score++;
    this.state.trialCount++;this.saveTrialCount();
    this.render();
    if(this.state.currentQ<this.state.questions.length-1){
      this.state.autoNextTimer=setTimeout(()=>{this.nextQuestion();},3000);
    }
  },
  prevQuestion(){
    if(this.state.autoNextTimer)clearTimeout(this.state.autoNextTimer);
    this.state.autoNextTimer=null;
    if(this.state.currentQ>0){this.state.currentQ--;this.render();}
  },
  nextQuestion(){
    if(this.state.autoNextTimer)clearTimeout(this.state.autoNextTimer);
    this.state.autoNextTimer=null;
    if(this.state.answers[this.state.currentQ]===undefined)return;
    if(this.state.currentQ<this.state.questions.length-1){this.state.currentQ++;this.render();}
    else{this.finishQuiz();}
  },
  finishQuiz(){
    if(this.state.autoNextTimer)clearTimeout(this.state.autoNextTimer);
    if(this.state.timer)clearInterval(this.state.timer);
    this.state.page='result';this.render();
  },
  showTrialModal(){document.getElementById('trialModal').classList.add('show');},
  copyWX(){
    const wx='18778629849';
    if(navigator.clipboard){navigator.clipboard.writeText(wx).then(()=>alert('微信号已复制：'+wx));}
    else{const ta=document.createElement('textarea');ta.value=wx;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('微信号已复制：'+wx);}
  },
  render(){
    const app=document.getElementById('app');

        <div class="header">
          <h1>📚 小学教育测评系统 <span class="badge">试用版</span></h1>

        </div>
        <div class="container">

            <div class="section-title">🎓 选择年级</div>
            <div class="grid">
              ${[1,2,3,4,5,6].map(g=>`<div class="liquid-btn ${s.grade===g?'active':''}" onclick="App.selectGrade(${g})">${g}年级</div>`).join('')}
            </div>
          </div>
          ${s.grade?`
          <div class="liquid">
            <div class="section-title">📖 选择科目</div>
            <div class="grid grid-2">
              ${Object.entries(this.subjects).map(([k,v])=>`<div class="liquid-btn ${s.subject===k?'active':''}" onclick="App.selectSubject('${k}')">${v.icon} ${v.name}</div>`).join('')}

          </div>`:''}
          ${s.subject?`<button class="liquid-primary" onclick="App.startQuiz()">🚀 开始测评</button>`:''}
          <div class="tip-liquid">
            💡 今日已体验 <strong>${this.state.trialCount}/10</strong> 题<br>
            完整版联系微信：18778629849
          </div>
        </div>`;
    }else if(s.page==='quiz'){
      const q=s.questions[s.currentQ];
      const progress=((s.currentQ+1)/s.questions.length)*100;
      const hasAnswered=s.answers[s.currentQ]!==undefined;
      const isCorrect=hasAnswered&&s.answers[s.currentQ]===q.answer;
      const subInfo=this.subjects[s.subject];
      const canPrev=s.currentQ>0;
      const canNext=hasAnswered&&s.currentQ<s.questions.length-1;
      const isLast=s.currentQ===s.questions.length-1;
      app.innerHTML=`
        <div class="container" style="padding-top:12px">
          <div class="quiz-bar">
            <div style="display:flex;gap:8px">
              <span class="quiz-tag">${subInfo.name}</span>

            <div class="timer-pill">⏱️ <span id="timerDisplay">${this.formatTime(s.elapsed)}</span></div>
          </div>
          <div class="progress-box">
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="progress-text">第 ${s.currentQ+1} 题 / 共 ${s.questions.length} 题</div>
          </div>
          <div class="q-liquid">
            <div class="q-num">📌 第 ${s.currentQ+1} 题</div>
            <div class="q-text">${q.text}</div>
            <div>
              ${q.options.map((opt,idx)=>`<div class="opt-liquid ${hasAnswered?(idx===q.answer?'correct':(idx===s.answers[s.currentQ]?'wrong':'')):''} ${hasAnswered?'disabled':''}" onclick="App.selectOption(${idx})"><span class="opt-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span></div>`).join('')}
            </div>
            <div class="parse-liquid ${hasAnswered?'show':''}"><div class="parse-title">${isCorrect?'🎉 回答正确！':'😅 回答错误'}</div>${q.parse}</div>
          </div>
          <div class="nav-liquid">
            <button class="nav-btn-liquid" onclick="App.prevQuestion()" ${!canPrev?'disabled':''}>⬅️ 上一题</button>
            <button class="nav-btn-liquid" onclick="App.nextQuestion()" ${!canNext?'disabled':''}>➡️ 下一题</button>
            <button class="nav-btn-liquid red" onclick="App.finishQuiz()">⏹️ ${isLast&&hasAnswered?'查看成绩':'结束并提交'}</button>
          </div>
          <div class="status-text">
            已答 ${s.answers.filter(a=>a!==undefined).length}/10 题
            ${hasAnswered&&!isLast?'<br><span style="color:#00b894;font-size:11px">💡 3秒后自动进入下一题</span>':''}
            ${hasAnswered&&isLast?'<br><span style="color:#fd79a8;font-size:11px">🎉 最后一题！点击查看成绩</span>':''}
          </div>
        </div>`;
    }else if(s.page==='result'){
      const pct=Math.round((s.score/s.questions.length)*100);
      let comment=pct>=90?'太棒了！🌟':pct>=60?'继续加油！💪':'多多练习！📚';
      const wrongQs=s.questions.map((q,i)=>({q,i})).filter(({q,i})=>s.answers[i]!==q.answer);
      app.innerHTML=`
        <div class="header" style="padding-bottom:8px"><h2>🎉 测评报告</h2></div>
        <div class="container">
          <div class="liquid score-liquid">
            <div class="score-circle"><div class="score-num">${pct}</div><div class="score-label">分</div></div>
            <div class="score-comment">${comment}</div>
          </div>
          <div class="liquid">
            <div class="detail-row"><span class="detail-label">科目</span><span class="detail-value">${this.subjects[s.subject].name}</span></div>

          ${wrongQs.length>0?`<div class="liquid"><div class="section-title">📝 错题回顾（${wrongQs.length}题）</div><div style="margin-top:8px">${wrongQs.map(({q,i})=>`<div style="padding:12px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px"><div style="color:#2d3436;font-weight:700;margin-bottom:3px">${i+1}. ${q.text}</div><div style="color:#fd79a8">你的答案：${['A','B','C','D'][s.answers[i]]} · 正确答案：${['A','B','C','D'][q.answer]}</div><div style="color:#00b894;margin-top:3px">💡 ${q.parse}</div></div>`).join('')}</div></div>`:''}

            联系微信：<strong>18778629849</strong>
