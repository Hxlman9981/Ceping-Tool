<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学教育测评系统 V5.0 · 试用版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#faf3e0 0%,#f5f0e1 50%,#e8f5e9 100%);
  color:#3e2723;
  line-height:1.6;
  position:relative;
  overflow-x:hidden;
}

/* 漂浮装饰 */
.float-deco{
  position:fixed;pointer-events:none;z-index:0;
  font-size:60px;opacity:.04;
  animation:float 8s ease-in-out infinite;
}
.float-deco:nth-child(1){top:5%;left:5%;animation-delay:0s}
.float-deco:nth-child(2){top:20%;right:8%;animation-delay:2s}
.float-deco:nth-child(3){top:45%;left:3%;animation-delay:4s}
.float-deco:nth-child(4){bottom:15%;right:5%;animation-delay:1s}
.float-deco:nth-child(5){bottom:30%;left:10%;animation-delay:3s}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-20px) rotate(5deg)}
}

.container{max-width:760px;margin:0 auto;padding:18px;position:relative;z-index:1}

/* ===== 水晶风首页 ===== */
.hero{
  text-align:center;padding:40px 20px 30px;
  background:linear-gradient(135deg,rgba(129,178,154,.85),rgba(90,140,111,.9));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:0 0 50px 50px;
  margin-bottom:24px;
  box-shadow:0 10px 40px rgba(90,140,111,.25);
  border-bottom:1px solid rgba(255,255,255,.3);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 60%);
  pointer-events:none;
}
.hero h1{font-size:28px;color:#fff;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,.15);position:relative}
.hero p{color:rgba(255,255,255,.9);font-size:15px;position:relative}
.trial-badge{
  display:inline-block;background:rgba(255,255,255,.25);
  backdrop-filter:blur(10px);color:#fff;padding:4px 14px;
  border-radius:20px;font-size:12px;margin-left:10px;
  border:1px solid rgba(255,255,255,.4);vertical-align:middle;
}

/* 水晶卡片 */
.glass-card{
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-radius:24px;
  padding:24px 22px;
  margin-bottom:18px;
  box-shadow:0 8px 32px rgba(31,38,135,.08),inset 0 0 0 1px rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.4);
  transition:transform .3s,box-shadow .3s;
}
.glass-card:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(31,38,135,.12),inset 0 0 0 1px rgba(255,255,255,.8)}
.glass-card h3{
  font-size:17px;color:#3e2723;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;font-weight:700;
}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}

/* 水晶按钮 */
.crystal-btn{
  padding:16px 8px;
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,.6);
  border-radius:16px;
  cursor:pointer;text-align:center;
  transition:all .3s;
  font-size:15px;font-weight:700;color:#3e2723;
  box-shadow:0 4px 16px rgba(31,38,135,.08),inset 0 0 20px rgba(255,255,255,.3);
  position:relative;overflow:hidden;
}
.crystal-btn::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition:left .5s;
}
.crystal-btn:hover::before{left:100%}
.crystal-btn:hover{
  background:rgba(255,255,255,.55);
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 8px 24px rgba(31,38,135,.15),inset 0 0 30px rgba(255,255,255,.5);
  border-color:rgba(255,255,255,.8);
}
.crystal-btn.active{
  background:linear-gradient(135deg,rgba(129,178,154,.8),rgba(90,140,111,.9));
  color:#fff;
  border-color:rgba(255,255,255,.5);
  box-shadow:0 6px 20px rgba(90,140,111,.3),inset 0 0 20px rgba(255,255,255,.3);
}

/* 大水晶按钮 */
.crystal-primary{
  width:100%;padding:18px;
  background:linear-gradient(135deg,rgba(244,162,97,.85),rgba(224,122,95,.9));
  backdrop-filter:blur(12px);
  color:#fff;border:none;border-radius:18px;
  font-size:18px;font-weight:800;cursor:pointer;
  margin-top:8px;transition:all .3s;
  box-shadow:0 8px 32px rgba(224,122,95,.25),inset 0 0 20px rgba(255,255,255,.3);
  border:1px solid rgba(255,255,255,.4);
  letter-spacing:1px;position:relative;overflow:hidden;
}
.crystal-primary::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition:left .5s;
}
.crystal-primary:hover::before{left:100%}
.crystal-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(224,122,95,.35),inset 0 0 30px rgba(255,255,255,.4);
}

/* 试用提示 */
.trial-tip{
  text-align:center;padding:18px;
  background:rgba(255,243,224,.7);
  backdrop-filter:blur(10px);
  border:2px dashed rgba(244,162,97,.4);
  border-radius:18px;margin-top:18px;
  color:#8d6e63;font-size:14px;line-height:1.8;
}

/* ===== 答题页 ===== */
.quiz-top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;flex-wrap:wrap;gap:8px;
}
.quiz-tag{
  font-size:12px;padding:6px 16px;border-radius:20px;
  font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08);
  background:linear-gradient(135deg,rgba(129,178,154,.85),rgba(90,140,111,.9));
  color:#fff;border:1px solid rgba(255,255,255,.3);
}
.timer-box{
  font-size:14px;color:#5d4037;font-weight:700;
  background:rgba(255,255,255,.5);padding:6px 14px;
  border-radius:12px;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.4);
}

.progress-wrap{margin-bottom:18px}
.progress-track{
  height:12px;background:rgba(200,200,200,.25);
  border-radius:6px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
  border:1px solid rgba(255,255,255,.3);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#81b29a,#f4a261);
  transition:width .5s cubic-bezier(.4,0,.2,1);
  border-radius:6px;
  box-shadow:0 0 12px rgba(129,178,154,.3);
}
.progress-text{
  text-align:center;font-size:13px;color:#8d6e63;
  margin-top:8px;font-weight:600;
}

/* 题目水晶卡 */
.q-card{
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(16px);
  border-radius:24px;padding:26px 24px;
  margin-bottom:16px;
  box-shadow:0 8px 32px rgba(31,38,135,.08),inset 0 0 0 1px rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.4);
}
.q-num{
  color:#5a8c6f;font-weight:800;margin-bottom:10px;
  font-size:14px;display:flex;align-items:center;gap:6px;
}
.q-text{font-size:20px;font-weight:800;margin-bottom:24px;color:#3e2723;line-height:1.7}

/* 选项水晶 */
.opt{
  display:flex;align-items:center;padding:16px 18px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.6);
  border-radius:16px;margin-bottom:12px;
  cursor:pointer;transition:all .25s;
  font-size:16px;position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.opt:hover{
  background:rgba(255,255,255,.75);
  transform:translateX(6px);
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  border-color:rgba(129,178,154,.4);
}
.opt-letter{
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.8);
  border:2px solid rgba(129,178,154,.3);
  color:#5a8c6f;display:flex;align-items:center;
  justify-content:center;font-weight:800;
  margin-right:14px;flex-shrink:0;font-size:15px;
  transition:all .25s;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.opt.correct{
  background:rgba(129,178,154,.15);
  border-color:rgba(129,178,154,.5);
  box-shadow:0 4px 16px rgba(129,178,154,.15);
}
.opt.correct .opt-letter{
  background:linear-gradient(135deg,#81b29a,#5a8c6f);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(129,178,154,.3);
}
.opt.wrong{
  background:rgba(224,122,95,.12);
  border-color:rgba(224,122,95,.4);
}
.opt.wrong .opt-letter{
  background:linear-gradient(135deg,#e07a5f,#c96b52);
  color:#fff;border-color:transparent;
}
.opt.disabled{pointer-events:none;opacity:.7}

/* 解析 */
.parse-box{
  margin-top:16px;padding:18px;
  background:rgba(129,178,154,.1);
  backdrop-filter:blur(8px);
  border-left:5px solid #81b29a;
  border-radius:14px;display:none;
  font-size:15px;line-height:1.7;color:#2d6a4f;
  animation:fadeIn .35s;
  border:1px solid rgba(129,178,154,.2);
}
.parse-box.show{display:block}
.parse-title{font-weight:800;margin-bottom:6px;font-size:16px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* 底部水晶导航 */
.nav-bar{display:flex;gap:12px;margin-top:16px}
.nav-crystal{
  flex:1;padding:14px;border-radius:16px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:all .3s;display:flex;align-items:center;
  justify-content:center;gap:6px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);
  color:#5d4037;
  box-shadow:0 4px 16px rgba(0,0,0,.06);
}
.nav-crystal:hover:not(:disabled){
  background:rgba(255,255,255,.75);
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.nav-crystal:disabled{
  background:rgba(200,200,200,.3);color:#aaa;
  cursor:not-allowed;box-shadow:none;
}
.nav-crystal.red{
  background:linear-gradient(135deg,rgba(224,122,95,.85),rgba(200,100,80,.9));
  color:#fff;border-color:rgba(255,255,255,.3);
  box-shadow:0 6px 20px rgba(224,122,95,.2);
}
.nav-crystal.red:hover:not(:disabled){
  box-shadow:0 8px 28px rgba(224,122,95,.3);
}

.status-bar{
  text-align:center;color:#a1887f;
  font-size:13px;margin-top:14px;font-weight:600;
}

/* ===== 结果页 ===== */
.result-hero{
  text-align:center;padding:36px 20px 28px;
  background:linear-gradient(135deg,rgba(244,162,97,.85),rgba(224,122,95,.9));
  backdrop-filter:blur(20px);
  border-radius:0 0 50px 50px;
  margin-bottom:24px;
  box-shadow:0 10px 40px rgba(224,122,95,.25);
  border-bottom:1px solid rgba(255,255,255,.3);
}
.result-hero h2{font-size:24px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.15)}

.score-ring{
  width:150px;height:150px;border-radius:50%;
  background:linear-gradient(135deg,#81b29a,#5a8c6f);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;margin:0 auto 18px;
  box-shadow:0 10px 30px rgba(90,140,111,.3);
  border:3px solid rgba(255,255,255,.4);
  color:#fff;position:relative;
}
.score-ring::before{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
}
.score-num{font-size:52px;font-weight:800;line-height:1}
.score-label{font-size:14px;opacity:.9;margin-top:4px}
.score-comment{font-size:20px;font-weight:700;color:#e07a5f;margin-top:10px}

.detail-row{
  display:flex;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid rgba(0,0,0,.06);
  font-size:15px;
}
.detail-row:last-child{border-bottom:none}
.detail-label{color:#8d6e63}
.detail-value{color:#3e2723;font-weight:700}

/* 弹窗水晶 */
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(61,64,91,.5);
  display:none;justify-content:center;align-items:center;
  z-index:1000;padding:20px;
  backdrop-filter:blur(6px);
}
.modal.show{display:flex}
.modal-glass{
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(24px);
  border-radius:28px;padding:36px 32px;
  max-width:400px;width:100%;text-align:center;
  animation:pop .4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 20px 60px rgba(0,0,0,.15);
  border:1px solid rgba(255,255,255,.6);
}
@keyframes pop{from{transform:scale(.85) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-icon{font-size:56px;margin-bottom:14px}
.modal h2{margin-bottom:10px;color:#3e2723;font-size:22px;font-weight:800}
.modal p{color:#8d6e63;margin-bottom:24px;font-size:15px;line-height:1.7}
.modal-btn{
  display:block;width:100%;padding:14px;border-radius:14px;
  border:none;font-size:16px;cursor:pointer;margin-bottom:12px;
  font-weight:700;transition:all .3s;
}
.modal-btn:hover{transform:translateY(-2px)}
.modal-btn.green{
  background:linear-gradient(135deg,#81b29a,#5a8c6f);
  color:#fff;box-shadow:0 6px 20px rgba(90,140,111,.25);
}
.modal-btn.gray{
  background:rgba(240,240,240,.8);color:#3e2723;
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);
}
.modal-btn.orange{
  background:rgba(255,243,224,.8);color:#8d6e63;
  border:2px dashed rgba(244,162,97,.4);
  backdrop-filter:blur(8px);
}

.wx-box{
  background:rgba(255,243,224,.6);
  backdrop-filter:blur(8px);
  border-radius:14px;padding:14px;margin-bottom:20px;
  border:2px dashed rgba(244,162,97,.3);
}
.wx-box strong{color:#e07a5f;font-size:22px;letter-spacing:2px;font-weight:800}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="float-deco">☁️</div>
<div class="float-deco">🌈</div>
<div class="float-deco">📚</div>
<div class="float-deco">⭐</div>
<div class="float-deco">✏️</div>

<div id="app"></div>

<!-- 试用结束弹窗 -->
<div id="trialModal" class="modal">
  <div class="modal-glass">
    <div class="modal-icon">☕</div>
    <h2>试用结束</h2>
    <p>今日<span style="color:#e07a5f;font-weight:800">10题</span>试用已完成！<br>完整版包含 1-6年级全部题库<br>每日随机20题 · 详细解析 · 薄弱点分析</p>
    <div class="wx-box">
      <div style="font-size:13px;color:#8d6e63;margin-bottom:6px">☕ 解锁仅需一杯奶茶钱</div>
      <strong>18778629849</strong>
    </div>
    <button class="modal-btn green" onclick="App.copyWX()">📋 复制微信号</button>
    <button class="modal-btn gray" onclick="App.goHome()">🏠 返回首页</button>
    <button class="modal-btn orange" onclick="location.reload()">🔄 明天再来（刷新）</button>
  </div>
</div>

<script>
/* ===== 题库生成器：每年级每科300题 ===== */
const QuestionBank = {
  // 数学生成器
  math(g){
    const qs=[];
    const add=(t,o,a,p)=>qs.push({t,o,a,p});
    const r=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

    if(g<=2){
      for(let i=0;i<300;i++){
        const type=r(1,6);
        if(type===1){const a=r(1,20),b=r(1,20),ans=a+b;add(`${a}+${b}=？`,[ans,ans+r(1,5),ans-r(1,5),ans+10].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}+${b}=${ans}`)}
        else if(type===2){const a=r(5,20),b=r(1,a),ans=a-b;add(`${a}-${b}=？`,[ans,ans+r(1,5),ans-r(1,5),ans+10].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}-${b}=${ans}`)}
        else if(type===3){const a=r(2,9),b=r(2,9),ans=a*b;add(`${a}×${b}=？`,[ans,ans+a,ans+b,ans+1].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}×${b}=${ans}`)}
        else if(type===4){const a=r(2,9),b=r(2,9),ans=a*b;add(`${ans}÷${a}=？`,[b,b+1,b-1,a].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${ans}÷${a}=${b}`)}
        else if(type===5){const shapes=['三角形','正方形','长方形','圆形'];const sides=[3,4,4,0];const idx=r(0,2);add(`一个${shapes[idx]}有几条边？`,[sides[idx],sides[idx]+1,sides[idx]-1,sides[idx]+2].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${shapes[idx]}有${sides[idx]}条边。`)}
        else{const h=r(1,12),m=[0,15,30,45][r(0,3)];add(`时钟显示${h}:${m.toString().padStart(2,'0')}，是几点？`,[`${h}:${m.toString().padStart(2,'0')}`,`${h+1}:${m.toString().padStart(2,'0')}`,`${h-1}:${m.toString().padStart(2,'0')}`,`${h}:${(m+15)%60}`],0,`正确时间是${h}:${m.toString().padStart(2,'0')}。`)}
      }
    }else if(g<=4){
      for(let i=0;i<300;i++){
        const type=r(1,6);
        if(type===1){const a=r(100,999),b=r(100,999),ans=a+b;add(`${a}+${b}=？`,[ans,ans+r(1,20),ans-r(1,20),ans+100].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}+${b}=${ans}`)}
        else if(type===2){const a=r(200,999),b=r(100,a),ans=a-b;add(`${a}-${b}=？`,[ans,ans+r(1,20),ans-r(1,20),ans+100].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}-${b}=${ans}`)}
        else if(type===3){const a=r(10,99),b=r(2,9),ans=a*b;add(`${a}×${b}=？`,[ans,ans+a,ans+b,ans+10].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}×${b}=${ans}`)}
        else if(type===4){const b=r(2,9),ans=r(10,99),a=ans*b;add(`${a}÷${b}=？`,[ans,ans+1,ans-1,ans+b].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}÷${b}=${ans}`)}
        else if(type===5){const a=r(1,9),b=r(1,9),c=r(1,9),d=r(1,9);add(`${a}/${b} + ${c}/${b} = ？`,[`${a+c}/${b}`,`${a+c}/${b+b}`,`${a+c+1}/${b}`,`${a}/${b+c}`],0,`同分母分数相加，分母不变分子相加：${a}+${c}=${a+c}，所以答案是${a+c}/${b}。`)}
        else{const a=r(2,20),b=r(2,20),c=r(2,20);const p=2*(a+b);add(`长方形长${a}cm，宽${b}cm，周长是？`,[p,2*a+b,a+2*b,a*b],0,`长方形周长=2×(长+宽)=2×(${a}+${b})=${p}cm。`)}
      }
    }else{
      for(let i=0;i<300;i++){
        const type=r(1,6);
        if(type===1){const a=r(10,99),b=r(10,99),ans=a*b;add(`${a}×${b}=？`,[ans,ans+r(1,50),ans-r(1,50),ans+100].filter((v,j,s)=>s.indexOf(v)===j).slice(0,4),0,`${a}×${b}=${ans}`)}

  copyWX(){
    const wx='18778629849';
    if(navigator.clipboard){navigator.clipboard.writeText(wx).then(()=>alert('微信号已复制：'+wx));}
    else{const ta=document.createElement('textarea');ta.value=wx;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('微信号已复制：'+wx);}
  },
  render(){
    const app=document.getElementById('app');
    const s=this.state;
    if(s.page==='home'){
      app.innerHTML=`
        <div class="hero">
          <h1>📚 小学教育测评系统 <span class="trial-badge">试用版</span></h1>
          <p>智能分卷 · 即时反馈 · 四科覆盖 · 每年级每科300题</p>
        </div>
        <div class="container">
          <div class="glass-card">
            <h3>🎓 选择年级</h3>
            <div class="grid">
              ${[1,2,3,4,5,6].map(g=>`<div class="crystal-btn ${s.grade===g?'active':''}" onclick="App.selectGrade(${g})">${g}年级</div>`).join('')}
            </div>
          </div>
          ${s.grade?`
          <div class="glass-card">
            <h3>📖 选择科目</h3>
            <div class="grid grid-2">
              ${Object.entries(this.subjects).map(([k,v])=>`<div class="crystal-btn ${s.subject===k?'active':''}" onclick="App.selectSubject('${k}')">${v.icon} ${v.name}</div>`).join('')}
            </div>
          </div>`:''}
          ${s.subject?`<button class="crystal-primary" onclick="App.startQuiz()">🚀 开始测评</button>`:''}
          <div class="trial-tip">
            💡 今日已体验 <strong>${this.state.trialCount}/10</strong> 题<br>
            完整版联系微信：18778629849
          </div>
        </div>`;
    }else if(s.page==='quiz'){
      const q=s.questions[s.currentQ];
      const progress=((s.currentQ+1)/s.questions.length)*100;
      const hasAnswered=s.answers[s.currentQ]!==undefined;
      const isCorrect=hasAnswered&&s.answers[s.currentQ]===q.answer;
      const subInfo=this.subjects[s.subject];
      const canPrev=s.currentQ>0;
      const canNext=hasAnswered&&s.currentQ<s.questions.length-1;
      const isLast=s.currentQ===s.questions.length-1;
      app.innerHTML=`
        <div class="container" style="padding-top:12px">
          <div class="quiz-top">
            <div class="quiz-tags">
              <span class="quiz-tag">${subInfo.name}</span>
              <span class="quiz-tag" style="background:linear-gradient(135deg,rgba(224,122,95,.85),rgba(200,100,80,.9))">${s.grade}年级</span>
            </div>
            <div class="timer-box">⏱️ 用时 <span id="timerDisplay">${this.formatTime(s.elapsed)}</span></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            <div class="progress-text">第 ${s.currentQ+1} 题 / 共 ${s.questions.length} 题</div>
          </div>
          <div class="q-card">
            <div class="q-num">第 ${s.currentQ+1} 题</div>
            <div class="q-text">${q.text}</div>
            <div class="options">
              ${q.options.map((opt,idx)=>`<div class="opt ${hasAnswered?(idx===q.answer?'correct':(idx===s.answers[s.currentQ]?'wrong':'')):''} ${hasAnswered?'disabled':''}" onclick="App.selectOption(${idx})"><span class="opt-letter">${['A','B','C','D'][idx]}</span><span>${opt}</span></div>`).join('')}
            </div>
            <div class="parse-box ${hasAnswered?'show':''}"><div class="parse-title">${isCorrect?'🎉 回答正确！':'😅 回答错误'}</div>${q.parse}</div>
          </div>
          <div class="nav-bar">
            <button class="nav-crystal" onclick="App.prevQuestion()" ${!canPrev?'disabled':''}>⬅️ 上一题</button>
            <button class="nav-crystal" onclick="App.nextQuestion()" ${!canNext?'disabled':''}>➡️ 下一题</button>
            <button class="nav-crystal red" onclick="App.finishQuiz()">⏹️ ${isLast&&hasAnswered?'查看成绩':'结束并提交'}</button>
          </div>
          <div class="status-bar">
            已答 ${s.answers.filter(a=>a!==undefined).length}/10 题
            ${hasAnswered&&!isLast?'<br><span style="color:#81b29a;font-size:12px">💡 3秒后自动进入下一题，也可手动点击</span>':''}
            ${hasAnswered&&isLast?'<br><span style="color:#e07a5f;font-size:12px">🎉 最后一题！点击查看成绩</span>':''}
          </div>
        </div>`;
    }else if(s.page==='result'){
      const pct=Math.round((s.score/s.questions.length)*100);
      let comment=pct>=90?'太棒了！🌟':pct>=60?'继续加油！💪':'多多练习！📚';
      const wrongQs=s.questions.map((q,i)=>({q,i})).filter(({q,i})=>s.answers[i]!==q.answer);
      app.innerHTML=`
        <div class="result-hero"><h2>🎉 测评报告</h2></div>
        <div class="container">
          <div class="glass-card result-score">
            <div class="score-ring"><div class="score-num">${pct}</div><div class="score-label">分</div></div>
            <div class="score-comment">${comment}</div>
          </div>
          <div class="glass-card result-detail">
            <div class="detail-row"><span class="detail-label">科目</span><span class="detail-value">${this.subjects[s.subject].name}</span></div>
            <div class="detail-row"><span class="detail-label">年级</span><span class="detail-value">${s.grade}年级</span></div>
            <div class="detail-row"><span class="detail-label">总题数</span><span class="detail-value">${s.questions.length}题</span></div>
            <div class="detail-row"><span class="detail-label">答对</span><span class="detail-value" style="color:#81b29a">${s.score}题</span></div>
            <div class="detail-row"><span class="detail-label">答错</span><span class="detail-value" style="color:#e07a5f">${s.questions.length-s.score}题</span></div>
            <div class="detail-row"><span class="detail-label">用时</span><span class="detail-value">${this.formatTime(s.elapsed)}</span></div>
          </div>
          ${wrongQs.length>0?`<div class="glass-card"><h3>📝 错题回顾（${wrongQs.length}题）</h3><div style="margin-top:10px">${wrongQs.map(({q,i})=>`<div style="padding:14px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:14px"><div style="color:#3e2723;font-weight:700;margin-bottom:4px">${i+1}. ${q.text}</div><div style="color:#e07a5f">你的答案：${['A','B','C','D'][s.answers[i]]} · 正确答案：${['A','B','C','D'][q.answer]}</div><div style="color:#81b29a;margin-top:4px">💡 ${q.parse}</div></div>`).join('')}</div></div>`:''}
          <button class="crystal-primary" onclick="App.goHome()">🏠 返回首页</button>
          <div class="trial-tip">
            📱 完整版解锁无限刷题 + 每年级每科300题不重复<br>
            联系微信：<strong>18778629849</strong>
          </div>
        </div>`;
    }
  }
};
App.init();
</script>
</body>
</html>
